<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>南大新传四季四景 | 院庆限定头像框</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <style>
        /* --- 红色调主题 (保持不变) --- */
        :root {
            --primary-gradient: linear-gradient(135deg, #c73b3b 0%, #e05a5a 100%);
            --primary-color: #c73b3b;
            --primary-light: #ffe6e6;
            --success-color: #b52e2e;
            --bg-color: #fff5f5;
            --card-bg: #ffffff;
            --text-main: #4a2a2a;
            --text-muted: #a06c6c;
            --border-color: #f0d5d5;
            --card-shadow: 0 12px 32px -12px rgba(160, 60, 60, 0.15);
            --hover-shadow: 0 18px 36px -12px rgba(199, 59, 59, 0.3);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif; 
            background: var(--bg-color); 
            background-image: radial-gradient(circle at 10% 20%, rgba(199, 59, 59, 0.05) 0%, transparent 60%);
            color: var(--text-main); 
            line-height: 1.5; 
            padding: 24px 16px 48px; 
            min-height: 100vh;
        }
        .container { max-width: 600px; margin: 0 auto; animation: fadeInUp 0.5s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .title { text-align: center; margin-bottom: 28px; }
        .title h1 { font-size: 1.85rem; font-weight: 800; background: linear-gradient(120deg, #c73b3b, #e07a5a, #b82b2b); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.3px; }
        .title p { font-size: 0.85rem; color: var(--text-muted); margin-top: 8px; }
        .step-card { background: var(--card-bg); padding: 22px 20px; border-radius: 28px; box-shadow: var(--card-shadow); margin-bottom: 24px; border: 1px solid rgba(255,255,255,0.7); }
        .step-label { display: flex; align-items: center; font-weight: 700; margin-bottom: 18px; font-size: 1.2rem; color: var(--text-main); }
        .step-number { background: var(--primary-light); color: var(--primary-color); width: 32px; height: 32px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; margin-right: 12px; font-size: 1rem; font-weight: 800; }
        button, .custom-file-upload, .download-btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; background: var(--primary-gradient); color: white; border: none; font-size: 1rem; font-weight: 600; border-radius: 40px; cursor: pointer; transition: all 0.25s ease; text-decoration: none; box-shadow: 0 6px 14px rgba(199, 59, 59, 0.2); gap: 8px; }
        button:hover, .download-btn:hover { box-shadow: var(--hover-shadow); transform: translateY(-2px); }
        button:active, .download-btn:active { transform: translateY(1px) scale(0.98); }
        button:disabled, .download-btn:disabled { background: #ebc2c2; color: #a87373; box-shadow: none; cursor: not-allowed; transform: none; }
        input[type="file"] { display: none; }
        .custom-file-upload { background: #fffafa; color: var(--primary-color); border: 2px dashed #f0bcbc; height: 68px; box-shadow: none; gap: 10px; font-weight: 500; }
        .custom-file-upload:hover { border-color: var(--primary-color); background: #fff0f0; transform: none; box-shadow: none; }
        .cropper-wrapper { display: none; margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 24px; }
        .img-container { width: 100%; height: 320px; background: #fef6f6; border-radius: 24px; overflow: hidden; margin-bottom: 20px; }
        .img-container img { display: block; max-width: 100%; }
        #confirmCropBtn { background: #fef0f0; color: var(--text-main); box-shadow: none; margin-bottom: 8px; }
        #confirmCropBtn:hover { background: #fce4e4; transform: none; }
        #confirmCropBtn.active-crop { background: var(--primary-gradient); color: white; box-shadow: 0 6px 14px rgba(199, 59, 59, 0.2); }
        .overlay-selector-container { width: 100%; overflow-x: auto; padding-bottom: 12px; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
        .overlay-selector { display: flex; gap: 18px; width: max-content; padding: 4px 4px 8px; }
        .overlay-option-wrapper { flex: 0 0 96px; text-align: center; }
        .overlay-option { width: 96px; height: 96px; border: 3px solid transparent; border-radius: 24px; cursor: pointer; object-fit: cover; background: #ffffff; transition: all 0.2s ease; box-shadow: 0 6px 12px rgba(0,0,0,0.04); }
        .overlay-option:hover { transform: translateY(-4px); box-shadow: 0 12px 20px rgba(0,0,0,0.08); }
        .overlay-option.active { border-color: var(--primary-color); box-shadow: 0 8px 20px rgba(199, 59, 59, 0.25); transform: translateY(-4px); }
        .overlay-name { font-size: 0.8rem; font-weight: 500; margin-top: 8px; color: var(--text-muted); }
        .overlay-option.active + .overlay-name { color: var(--primary-color); font-weight: 700; }
        .slide-hint { text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .slide-hint i { font-style: normal; font-size: 1rem; }
        .preview-area { margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
        #finalImage { max-width: 100%; border-radius: 28px; box-shadow: 0 20px 35px -8px rgba(0,0,0,0.2); display: none; background: #fffbfb; }
        .wechat-hint { display: none; color: #c73b3b; font-weight: 600; font-size: 1rem; background: #ffe6e6; padding: 12px 24px; border-radius: 60px; animation: gentleFloat 2s infinite ease; box-shadow: 0 4px 12px rgba(199, 59, 59, 0.15); }
        @keyframes gentleFloat { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }
    </style>
</head>
<body>
<div class="container">
    <div class="title">
        <h1>南大新传四季四景</h1>
        <p>🎓 生成你的“院庆限定”头像框 🎓</p>
    </div>

    <div class="step-card">
        <div class="step-label"><span class="step-number">1</span><span>上传底图</span></div>
        <label for="uploadInput" class="custom-file-upload">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
            </svg>
            点击上传照片
        </label>
        <input type="file" id="uploadInput" accept="image/jpeg, image/png, image/webp">
        <div class="cropper-wrapper" id="cropperWrapper">
            <div class="img-container"><img id="imageToCrop" src="" alt="上传图片"></div>
            <button id="confirmCropBtn">✓ 确定裁剪区域</button>
        </div>
    </div>

    <div class="step-card">
        <div class="step-label"><span class="step-number">2</span><span>选择季节边框</span></div>
        <div class="overlay-selector-container">
            <div class="overlay-selector" id="overlaySelector">
                <div class="overlay-option-wrapper"><img src="frames/spring.png" data-url="frames/spring.png" class="overlay-option active" alt="春框"><p class="overlay-name">繁花携春</p></div>
                <div class="overlay-option-wrapper"><img src="frames/summer.png" data-url="frames/summer.png" class="overlay-option" alt="夏框"><p class="overlay-name">紫藤迎夏</p></div>
                <div class="overlay-option-wrapper"><img src="frames/autumn.png" data-url="frames/autumn.png" class="overlay-option" alt="秋框"><p class="overlay-name">金风染秋</p></div>
                <div class="overlay-option-wrapper"><img src="frames/winter.png" data-url="frames/winter.png" class="overlay-option" alt="冬框"><p class="overlay-name">晴雪伴冬</p></div>
            </div>
        </div>
        <div class="slide-hint"><i>←</i> 左右滑动选择季节边框 <i>→</i></div>
    </div>

    <div class="step-card">
        <div class="step-label"><span class="step-number">3</span><span>预览与保存</span></div>
        <button id="mergeBtn" disabled>请先完成底图裁剪</button>
        <div class="preview-area">
            <canvas id="resultCanvas" style="display:none;"></canvas>
            <img id="finalImage" alt="合成结果">
            <div id="wechatHint" class="wechat-hint">✨ 制作完成，长按图片即可保存 ✨</div>
            <a href="#" id="downloadBtn" class="download-btn" download="nju_avatar.png" style="display:none;">⬇ 一键保存至相册</a>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script>
    const uploadInput = document.getElementById('uploadInput');
    const cropperWrapper = document.getElementById('cropperWrapper');
    const imageToCrop = document.getElementById('imageToCrop');
    const confirmCropBtn = document.getElementById('confirmCropBtn');
    const mergeBtn = document.getElementById('mergeBtn');
    const resultCanvas = document.getElementById('resultCanvas');
    const resultCtx = resultCanvas.getContext('2d');
    const finalImage = document.getElementById('finalImage');
    const downloadBtn = document.getElementById('downloadBtn');
    const wechatHint = document.getElementById('wechatHint');

    let cropper = null;
    let finalCroppedCanvas = null;
    let currentLoadedOverlay = null;

    const isWeChat = /MicroMessenger/i.test(navigator.userAgent);
    let currentOverlayUrl = document.querySelector('.overlay-option.active').getAttribute('data-url');

    const overlayOptions = document.querySelectorAll('.overlay-option');
    overlayOptions.forEach(option => {
        option.addEventListener('click', function() {
            overlayOptions.forEach(opt => opt.classList.remove('active'));
            this.classList.add('active');
            currentOverlayUrl = this.getAttribute('data-url');
            if (finalCroppedCanvas) loadOverlayAndRender();
        });
    });

    uploadInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            imageToCrop.src = event.target.result;
            cropperWrapper.style.display = 'block';
            if (cropper) cropper.destroy();
            cropper = new Cropper(imageToCrop, {
                aspectRatio: 1, viewMode: 1, guides: false, background: false, autoCropArea: 0.8, responsive: true, restore: false
            });
            mergeBtn.disabled = true;
            mergeBtn.textContent = '请先完成底图裁剪';
            finalImage.style.display = 'none';
            downloadBtn.style.display = 'none';
            wechatHint.style.display = 'none';
            confirmCropBtn.textContent = '确认当前裁剪区域';
            confirmCropBtn.classList.add('active-crop');
            confirmCropBtn.disabled = false;
        };
        reader.readAsDataURL(file);
    });

    confirmCropBtn.addEventListener('click', () => {
        if (!cropper) return;
        cropper.disable();
        finalCroppedCanvas = cropper.getCroppedCanvas({ width: 1000, height: 1000, imageSmoothingQuality: 'high' });
        confirmCropBtn.textContent = '✓ 底图已锁定';
        confirmCropBtn.classList.remove('active-crop');
        confirmCropBtn.disabled = true;
        mergeBtn.disabled = false;
        mergeBtn.textContent = '✨ 生成院庆头像 ✨';
        loadOverlayAndRender();
    });

    function loadOverlayAndRender() {
        if (!finalCroppedCanvas) return;
        mergeBtn.disabled = true;
        mergeBtn.textContent = '⏳ 融合四季韵味中...';
        const overlayImg = new Image();
        overlayImg.crossOrigin = "Anonymous";
        overlayImg.onload = () => {
            currentLoadedOverlay = overlayImg;
            renderFinalImage();
            mergeBtn.disabled = false;
            mergeBtn.textContent = '✅ 生成完毕！可切换边框试试';
        };
        overlayImg.onerror = () => {
            alert(`边框加载失败，请检查图片路径：${currentOverlayUrl}`);
            mergeBtn.disabled = false;
            mergeBtn.textContent = '重新生成';
        };
        overlayImg.src = currentOverlayUrl;
    }

    // ***** 核心修改：让头像完全填满画布（cover模式），无白边 *****
    function renderFinalImage() {
        if (!finalCroppedCanvas || !currentLoadedOverlay) return;

        const SIZE = 640;   // 标准微信头像尺寸
        resultCanvas.width = SIZE;
        resultCanvas.height = SIZE;

        // 1. 白色背景（边框透明区域会透出白色，若边框完全覆盖则无影响）
        resultCtx.fillStyle = "#ffffff";
        resultCtx.fillRect(0, 0, SIZE, SIZE);

        // 2. 绘制头像：使用 cover 模式，确保头像填满整个画布且不变形
        const img = finalCroppedCanvas;
        const scaleW = SIZE / img.width;
        const scaleH = SIZE / img.height;
        const scale = Math.max(scaleW, scaleH);   // 取大值，保证覆盖
        const drawW = img.width * scale;
        const drawH = img.height * scale;
        const drawX = (SIZE - drawW) / 2;
        const drawY = (SIZE - drawH) / 2;
        
        resultCtx.drawImage(img, drawX, drawY, drawW, drawH);
        
        // 3. 绘制边框（透明 PNG 叠加，镂空区域会透出头像）
        resultCtx.drawImage(currentLoadedOverlay, 0, 0, SIZE, SIZE);

        // 导出图片
        const dataUrl = resultCanvas.toDataURL('image/png', 0.92);
        finalImage.src = dataUrl;
        finalImage.style.display = 'block';

        if (isWeChat) {
            wechatHint.style.display = 'block';
            downloadBtn.style.display = 'none';
        } else {
            wechatHint.style.display = 'none';
            downloadBtn.style.display = 'flex';
            downloadBtn.href = dataUrl;
        }
    }

    mergeBtn.addEventListener('click', () => {
        if (!finalCroppedCanvas) {
            alert('请先上传并裁剪图片');
            return;
        }
        loadOverlayAndRender();
    });
</script>
</body>
</html>
