<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>南大新传四季四景 | 院庆限定头像框</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <style>
        /* --- 清新南大风格变量 --- */
        :root {
            --primary-gradient: linear-gradient(135deg, #0f5b7a 0%, #1e88a8 100%);
            --primary-color: #1e6f5c;
            --primary-light: #d4f0f0;
            --success-color: #2c7a5e;
            --bg-color: #f0f7f4;
            --card-bg: #ffffff;
            --text-main: #1e3b3b;
            --text-muted: #5f7f7f;
            --border-color: #d9e4e0;
            --card-shadow: 0 12px 32px -12px rgba(0,32,32,0.12);
            --hover-shadow: 0 18px 36px -12px rgba(30,111,92,0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif; 
            background: var(--bg-color); 
            background-image: radial-gradient(circle at 10% 20%, rgba(30,136,168,0.08) 0%, transparent 60%);
            color: var(--text-main); 
            line-height: 1.5; 
            padding: 24px 16px 48px; 
            min-height: 100vh;
        }

        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 主标题 */
        .title {
            text-align: center;
            margin-bottom: 28px;
        }
        .title h1 {
            font-size: 1.85rem;
            font-weight: 800;
            background: linear-gradient(120deg, #1e6f5c, #2c8e6c, #1e88a8);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
        }
        .title p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* 卡片样式 */
        .step-card { 
            background: var(--card-bg); 
            padding: 22px 20px; 
            border-radius: 28px; 
            box-shadow: var(--card-shadow); 
            margin-bottom: 24px; 
            border: 1px solid rgba(255,255,255,0.7);
            backdrop-filter: blur(0px);
            transition: transform 0.2s;
        }

        .step-label { 
            display: flex; 
            align-items: center; 
            font-weight: 700; 
            margin-bottom: 18px; 
            font-size: 1.2rem; 
            color: var(--text-main); 
        }

        .step-number { 
            background: var(--primary-light); 
            color: var(--primary-color); 
            width: 32px; 
            height: 32px; 
            border-radius: 12px;
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            margin-right: 12px; 
            font-size: 1rem; 
            font-weight: 800;
        }

        /* 按钮 */
        button, .custom-file-upload, .download-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 100%; 
            height: 52px; 
            background: var(--primary-gradient); 
            color: white; 
            border: none; 
            font-size: 1rem; 
            font-weight: 600; 
            border-radius: 40px; 
            cursor: pointer; 
            transition: all 0.25s ease; 
            text-decoration: none; 
            box-shadow: 0 6px 14px rgba(30,111,92,0.2);
            gap: 8px;
        }

        button:hover, .download-btn:hover { 
            box-shadow: var(--hover-shadow);
            transform: translateY(-2px);
        }

        button:active, .download-btn:active { 
            transform: translateY(1px) scale(0.98); 
        }

        button:disabled, .download-btn:disabled { 
            background: #cbdcd6; 
            color: #8aa39b;
            box-shadow: none; 
            cursor: not-allowed; 
            transform: none; 
        }

        /* 上传区 */
        input[type="file"] { display: none; }
        .custom-file-upload { 
            background: #f8fefb; 
            color: var(--primary-color); 
            border: 2px dashed #bfdad0; 
            height: 68px; 
            box-shadow: none;
            gap: 10px;
            font-weight: 500;
        }
        .custom-file-upload:hover { 
            border-color: var(--primary-color); 
            background: #edf9f3; 
            transform: none;
            box-shadow: none;
        }

        /* Cropper 区域 */
        .cropper-wrapper { display: none; margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 24px; }
        .img-container { width: 100%; height: 320px; background: #eef3f0; border-radius: 24px; overflow: hidden; margin-bottom: 20px; }
        .img-container img { display: block; max-width: 100%; }
        
        #confirmCropBtn { background: #eef3f0; color: var(--text-main); box-shadow: none; margin-bottom: 8px; }
        #confirmCropBtn:hover { background: #dfe8e2; transform: none; }
        #confirmCropBtn.active-crop { background: var(--primary-gradient); color: white; box-shadow: 0 6px 14px rgba(30,111,92,0.2); }

        /* 横向滚动选择器 (四季边框) */
        .overlay-selector-container { 
            width: 100%; 
            overflow-x: auto; 
            padding-bottom: 12px; 
            -webkit-overflow-scrolling: touch; 
            scrollbar-width: thin;
        }
        .overlay-selector { display: flex; gap: 18px; width: max-content; padding: 4px 4px 8px; }
        .overlay-option-wrapper { flex: 0 0 96px; text-align: center; }
        
        .overlay-option { 
            width: 96px; 
            height: 96px; 
            border: 3px solid transparent; 
            border-radius: 24px; 
            cursor: pointer; 
            object-fit: cover; 
            background: #ffffff; 
            transition: all 0.2s ease; 
            box-shadow: 0 6px 12px rgba(0,0,0,0.04); 
        }
        .overlay-option:hover { transform: translateY(-4px); box-shadow: 0 12px 20px rgba(0,0,0,0.08); }
        .overlay-option.active { 
            border-color: var(--primary-color); 
            box-shadow: 0 8px 20px rgba(30,111,92,0.25); 
            transform: translateY(-4px); 
        }
        .overlay-name { font-size: 0.8rem; font-weight: 500; margin-top: 8px; color: var(--text-muted); }
        .overlay-option.active + .overlay-name { color: var(--primary-color); font-weight: 700; }

        /* 结果展示区 */
        .preview-area { margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 24px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
        #finalImage { max-width: 100%; border-radius: 28px; box-shadow: 0 20px 35px -8px rgba(0,0,0,0.2); display: none; background: #fafefb; }
        
        .wechat-hint { 
            display: none; 
            color: #1e6f5c; 
            font-weight: 600; 
            font-size: 1rem; 
            background: #d4f0e8; 
            padding: 12px 24px; 
            border-radius: 60px; 
            animation: gentleFloat 2s infinite ease; 
            box-shadow: 0 4px 12px rgba(30,111,92,0.15);
        }
        @keyframes gentleFloat { 
            0% { transform: translateY(0px); } 
            50% { transform: translateY(-5px); } 
            100% { transform: translateY(0px); } 
        }
    </style>
</head>
<body>
<div class="container">
    <div class="title">
        <h1>南大新传四季四景</h1>
        <p>🎓 生成你的“院庆限定”头像框 🎓</p>
    </div>

    <!-- 步骤1：上传与裁剪 -->
    <div class="step-card">
        <div class="step-label">
            <span class="step-number">1</span>
            <span>上传底图</span>
        </div>
        <label for="uploadInput" class="custom-file-upload">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                <circle cx="12" cy="13" r="4"/>
            </svg>
            点击上传照片
        </label>
        <input type="file" id="uploadInput" accept="image/jpeg, image/png, image/webp">
        <div class="cropper-wrapper" id="cropperWrapper">
            <div class="img-container">
                <img id="imageToCrop" src="" alt="上传图片">
            </div>
            <button id="confirmCropBtn">✓ 确定裁剪区域</button>
        </div>
    </div>

    <!-- 步骤2：选择四季边框 -->
    <div class="step-card">
        <div class="step-label">
            <span class="step-number">2</span>
            <span>选择季节边框</span>
        </div>
        <div class="overlay-selector-container">
            <div class="overlay-selector" id="overlaySelector">
                <!-- 春 -->
                <div class="overlay-option-wrapper">
                    <img src="frames/spring.png" data-url="frames/spring.png" class="overlay-option active" alt="春框">
                    <p class="overlay-name">🌸 春 · 繁花</p>
                </div>
                <!-- 夏 -->
                <div class="overlay-option-wrapper">
                    <img src="frames/summer.png" data-url="frames/summer.png" class="overlay-option" alt="夏框">
                    <p class="overlay-name">🍃 夏 · 清荷</p>
                </div>
                <!-- 秋 -->
                <div class="overlay-option-wrapper">
                    <img src="frames/autumn.png" data-url="frames/autumn.png" class="overlay-option" alt="秋框">
                    <p class="overlay-name">🍂 秋 · 金风</p>
                </div>
                <!-- 冬 -->
                <div class="overlay-option-wrapper">
                    <img src="frames/winter.png" data-url="frames/winter.png" class="overlay-option" alt="冬框">
                    <p class="overlay-name">❄️ 冬 · 晴雪</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 步骤3：预览与保存 -->
    <div class="step-card">
        <div class="step-label">
            <span class="step-number">3</span>
            <span>预览与保存</span>
        </div>
        <button id="mergeBtn" disabled>请先完成底图裁剪</button>
        <div class="preview-area">
            <canvas id="resultCanvas" style="display:none;"></canvas>
            <img id="finalImage" alt="合成结果">
            <div id="wechatHint" class="wechat-hint">✨ 制作完成，长按图片即可保存 ✨</div>
            <a href="#" id="downloadBtn" class="download-btn" download="nju_avatar.png" style="display:none;">⬇ 一键保存至相册</a>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script>
    // ----- DOM 元素 -----
    const uploadInput = document.getElementById('uploadInput');
    const cropperWrapper = document.getElementById('cropperWrapper');
    const imageToCrop = document.getElementById('imageToCrop');
    const confirmCropBtn = document.getElementById('confirmCropBtn');
    const mergeBtn = document.getElementById('mergeBtn');
    const resultCanvas = document.getElementById('resultCanvas');
    const resultCtx = resultCanvas.getContext('2d');
    const finalImage = document.getElementById('finalImage');
    const downloadBtn = document.getElementById('downloadBtn');
    const wechatHint = document.getElementById('wechatHint');

    let cropper = null;
    let finalCroppedCanvas = null;     // 裁剪后的头像canvas
    let currentLoadedOverlay = null;

    // 检测微信环境
    const isWeChat = /MicroMessenger/i.test(navigator.userAgent);
    let currentOverlayUrl = document.querySelector('.overlay-option.active').getAttribute('data-url');

    // ----- 切换边框 (自动重绘) -----
    const overlayOptions = document.querySelectorAll('.overlay-option');
    overlayOptions.forEach(option => {
        option.addEventListener('click', function() {
            overlayOptions.forEach(opt => opt.classList.remove('active'));
            this.classList.add('active');
            currentOverlayUrl = this.getAttribute('data-url');
            if (finalCroppedCanvas) {
                loadOverlayAndRender();
            }
        });
    });

    // ----- 上传图片并初始化裁剪器 -----
    uploadInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            imageToCrop.src = event.target.result;
            cropperWrapper.style.display = 'block';
            if (cropper) cropper.destroy();
            cropper = new Cropper(imageToCrop, {
                aspectRatio: 1,
                viewMode: 1,
                guides: false,
                background: false,
                autoCropArea: 0.8,
                responsive: true,
                restore: false
            });
            mergeBtn.disabled = true;
            mergeBtn.textContent = '请先完成底图裁剪';
            finalImage.style.display = 'none';
            downloadBtn.style.display = 'none';
            wechatHint.style.display = 'none';
            confirmCropBtn.textContent = '确认当前裁剪区域';
            confirmCropBtn.classList.add('active-crop');
            confirmCropBtn.disabled = false;
        };
        reader.readAsDataURL(file);
    });

    // ----- 确认裁剪 -----
    confirmCropBtn.addEventListener('click', () => {
        if (!cropper) return;
        cropper.disable();
        finalCroppedCanvas = cropper.getCroppedCanvas({ width: 1000, height: 1000, imageSmoothingQuality: 'high' });
        confirmCropBtn.textContent = '✓ 底图已锁定';
        confirmCropBtn.classList.remove('active-crop');
        confirmCropBtn.disabled = true;
        mergeBtn.disabled = false;
        mergeBtn.textContent = '✨ 生成院庆头像 ✨';
        // 自动生成一次（可选）
        loadOverlayAndRender();
    });

    // ----- 加载边框图片并合成 -----
    function loadOverlayAndRender() {
        if (!finalCroppedCanvas) return;
        mergeBtn.disabled = true;
        mergeBtn.textContent = '⏳ 融合四季韵味中...';

        const overlayImg = new Image();
        overlayImg.crossOrigin = "Anonymous";
        overlayImg.onload = () => {
            currentLoadedOverlay = overlayImg;
            renderFinalImage();
            mergeBtn.disabled = false;
            mergeBtn.textContent = '✅ 生成完毕！可切换边框试试';
        };
        overlayImg.onerror = () => {
            alert(`边框加载失败，请检查图片路径：${currentOverlayUrl}`);
            mergeBtn.disabled = false;
            mergeBtn.textContent = '重新生成';
        };
        overlayImg.src = currentOverlayUrl;
    }

    // ----- 核心合成逻辑 (与第一问一致：缩放+偏移参数可调) -----
    function renderFinalImage() {
        if (!finalCroppedCanvas || !currentLoadedOverlay) return;

        // 固定缩放比例和偏移量（可微调，确保头像在框内美观）
        const scale = 0.86;
        const offsetX = 0;
        const offsetY = 24;

        const w = finalCroppedCanvas.width;
        const h = finalCroppedCanvas.height;
        resultCanvas.width = w;
        resultCanvas.height = h;

        // 白色底
        resultCtx.fillStyle = "#ffffff";
        resultCtx.fillRect(0, 0, w, h);

        // 绘制底图
        const scaledW = w * scale;
        const scaledH = h * scale;
        const baseX = (w - scaledW) / 2;
        const baseY = (h - scaledH) / 2;
        const finalX = baseX + offsetX;
        const finalY = baseY + offsetY;
        resultCtx.drawImage(finalCroppedCanvas, finalX, finalY, scaledW, scaledH);

        // 绘制边框（透明PNG叠加）
        resultCtx.drawImage(currentLoadedOverlay, 0, 0, w, h);

        // 导出为图片
        const dataUrl = resultCanvas.toDataURL('image/png', 0.92);
        finalImage.src = dataUrl;
        finalImage.style.display = 'block';

        // 根据环境切换保存方式
        if (isWeChat) {
            wechatHint.style.display = 'block';
            downloadBtn.style.display = 'none';
        } else {
            wechatHint.style.display = 'none';
            downloadBtn.style.display = 'flex';
            downloadBtn.href = dataUrl;
        }
    }

    // 手动点击“生成”按钮（也支持重新生成）
    mergeBtn.addEventListener('click', () => {
        if (!finalCroppedCanvas) {
            alert('请先上传并裁剪图片');
            return;
        }
        loadOverlayAndRender();
    });

    // 确保在微信中长按图片有效，并且没有冗余预览区
    // 初始化显示逻辑
    if (!isWeChat) {
        // 电脑端显示下载按钮默认隐藏，等合成后才显示
    }
</script>
</body>
</html>
